version: '3.8'

services:
  # 1. The Local Database Service
  mongodb:
    image: mongo:6.0
    container_name: camping-app-database
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Secure the local database with a username and password
      MONGO_INITDB_ROOT_USERNAME: camping_admin
      MONGO_INITDB_ROOT_PASSWORD: secure_local_password
      MONGO_INITDB_DATABASE: camping_db
    volumes:
      # Mounts a named volume to ensure data is saved when containers stop
      - mongo-data:/data/db

  # 2. The Node.js Web Application Service
  camping-app:
    image: rajeshchandran007/camping-app-nodejs:latest
    container_name: camping-app-backend
    restart: always
    ports:
      - "3003:3000"
    env_file:
      - .env
    depends_on:
      - mongodb

volumes:
  mongo-data:
